<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="icon"
        type="image/png"
        href="./assets/logo/logo.png"
    >

    <title>Hartseer Analytics</title>

    <link
        rel="stylesheet"
        href="./css/styles.css"
    >
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar__brand">
                <a
                    href="#/executive"
                    class="sidebar__brand-link"
                    aria-label="Ir al Dashboard Ejecutivo de Hartseer Analytics"
                >
                    <img
                        src="./assets/logo/logo.png"
                        alt="Hartseer Analytics"
                        class="sidebar__logo"
                    >
                </a>
            </div>

            <nav
                class="sidebar__navigation"
                aria-label="Navegación principal"
            >
                <section class="sidebar__section">
                    <ul class="sidebar__nav-list">
                        <li class="sidebar__nav-item">
                            <a
                                href="#/executive"
                                class="sidebar__nav-link sidebar__nav-link--active"
                                data-route="executive"
                                aria-current="page"
                            >
                                <img
                                    src="./assets/icons/sidebar/layout-dashboard.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Executive
                                </span>
                            </a>
                        </li>

                        <li class="sidebar__nav-item">
                            <a
                                href="#/products"
                                class="sidebar__nav-link"
                                data-route="products"
                            >
                                <img
                                    src="./assets/icons/sidebar/package.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Products
                                </span>
                            </a>
                        </li>

                        <li class="sidebar__nav-item">
                            <a
                                href="#/customers"
                                class="sidebar__nav-link"
                                data-route="customers"
                            >
                                <img
                                    src="./assets/icons/sidebar/users.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Customers
                                </span>
                            </a>
                        </li>

                        <li class="sidebar__nav-item">
                            <a
                                href="#/marketing"
                                class="sidebar__nav-link"
                                data-route="marketing"
                            >
                                <img
                                    src="./assets/icons/sidebar/megaphone.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Marketing
                                </span>
                            </a>
                        </li>
                    </ul>
                </section>

                <div
                    class="sidebar__divider"
                    aria-hidden="true"
                ></div>

                <section class="sidebar__section">
                    <ul class="sidebar__nav-list">
                        <li class="sidebar__nav-item">
                            <div
                                class="sidebar__nav-link sidebar__nav-link--disabled"
                                aria-disabled="true"
                            >
                                <img
                                    src="./assets/icons/sidebar/file-chart-column.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Reports
                                </span>

                                <span class="sidebar__version-badge">
                                    v1.1
                                </span>
                            </div>
                        </li>

                        <li class="sidebar__nav-item">
                            <div
                                class="sidebar__nav-link sidebar__nav-link--disabled"
                                aria-disabled="true"
                            >
                                <img
                                    src="./assets/icons/sidebar/bell.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Alerts
                                </span>

                                <span class="sidebar__version-badge">
                                    v1.2
                                </span>
                            </div>
                        </li>

                        <li class="sidebar__nav-item">
                            <div
                                class="sidebar__nav-link sidebar__nav-link--disabled"
                                aria-disabled="true"
                            >
                                <img
                                    src="./assets/icons/sidebar/database.svg"
                                    alt=""
                                    class="sidebar__nav-icon"
                                >

                                <span class="sidebar__nav-label">
                                    Data Explorer
                                </span>

                                <span class="sidebar__version-badge">
                                    v1.2
                                </span>
                            </div>
                        </li>
                    </ul>
                </section>
            </nav>

            <div class="sidebar__footer">
                <div
                    class="sidebar__divider"
                    aria-hidden="true"
                ></div>

                <a
                    href="#"
                    class="sidebar__documentation"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <img
                        src="./assets/icons/sidebar/book-open.svg"
                        alt=""
                        class="sidebar__nav-icon"
                    >

                    <span class="sidebar__nav-label">
                        Documentation
                    </span>
                </a>
            </div>
        </aside>

        <main
            id="dashboard-root"
            class="main-content"
        ></main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script src="./js/data-service.js"></script>
    <script src="./js/analytics.js"></script>
    <script src="./js/charts.js"></script>
    <script src="./js/dashboard-controller.js"></script>

    <script src="./js/views/customers.js"></script>
    <script src="./js/views/executive.js"></script>
    <script src="./js/views/marketing.js"></script>
    <script src="./js/views/products.js"></script>

    <script src="./js/router.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
